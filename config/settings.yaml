# Optional override, read from config/ in the folder gridflow runs from. These
# values equal the code defaults. Set the data root with GRIDFLOW_DATA_DIR
# (default ~/gridflow-data), not here, so every folder finds the same data.
pipeline:
  default_lookback_hours: 24
  max_concurrent_requests: 5
  console_log_level: "WARNING"

quality:
  null_rate_threshold: 0.05
  enable_outlier_detection: true
