[project]
name = "gridflow"
version = "0.16.0"
description = "UK/EU energy market data pipeline for quantitative modelling"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "polars>=1.0",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "lxml>=5.0",
    "typer>=0.12",
    "python-json-logger>=3.1",  # 3.1 moved JsonFormatter to pythonjsonlogger.json (jsonlogger deprecated)
    "pyyaml>=6.0",
    "tzdata>=2024.1",
    "python-dotenv>=1.0",
    "fastexcel>=0.21.0",
    "certifi>=2024.7.4",  # imported by connectors/base.py for its CA bundle, not only via httpx
    "truststore>=0.10",  # connectors trust the OS certificate store, as behind a corporate proxy
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff==0.15.12",  # pinned for reproducible CI lint/format (F29; floating >=0.4 drifts rules across runs)
    "mypy>=1.10",
]

[project.scripts]
gridflow = "gridflow.cli:app"

# Outside the core dependencies, so the library stays Polars-only. plotly 6 reads
# Polars frames directly (through narwhals), so the notebooks never need pandas.
[dependency-groups]
notebooks = [
    "jupyterlab>=4.2",
    "jupytext>=1.16",
    "ipykernel>=6.29",
    "plotly>=6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gridflow.config" = ["sources.yaml", "presets/*.yaml"]
"gridflow.connectors.neso_data_portal.registry" = ["*.json"]
"gridflow.gold" = ["views/*.sql", "views/held/*.sql"]

[tool.jupytext]
formats = "py:percent"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.ruff.lint.flake8-type-checking]
# pydantic v2 evaluates field annotations at runtime, so imports used only in
# model annotations must NOT be relocated into a TYPE_CHECKING block by the
# TC00x rules — doing so makes pydantic fail to resolve the forward refs at
# runtime (F29: an unguarded --fix broke 82 schema tests). List BaseModel plus
# the first-party schema bases that subclass it.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "gridflow.schemas.common.BaseSchema",
    "gridflow.schemas.common.TimestampMixin",
    "gridflow.schemas.common.SettlementPeriodMixin",
]

[tool.mypy]
# The lowest supported Python: the explorer runs gridflow on 3.11.
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: tests that ping real APIs over the network (may be slow, require internet)",
    "integration: end-to-end tests exercising the CLI/storage stack against a tmp workspace (no network)",
    "slow: tests too slow for the default gate; deselected by the `-m 'not live and not slow'` run",
]
