name: CI
on:
  # Branch pushes run through their pull_request run, so only master runs here.
  push:
    branches: [master]
    # Prose only. docs/ also holds test inputs (the endpoint catalogues,
    # docs/neso_data_portal/), so it is not ignored whole.
    # Not on pull_request: its run is the required check and must always start.
    paths-ignore:
      - "*.md"
      - "docs/*.md"
      - "docs/DECISION_LOG/**"
      - "docs/audit/**"
      - "docs/endpoints/**"
  pull_request:
  # Weekly run of the slow memory gates, which the PR run and the local gate skip.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  lint-and-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Guard against tracked .ipynb in notebooks/
        run: |
          if git ls-files notebooks | grep -q '\.ipynb$'; then
            echo "Tracked .ipynb file found in notebooks/ — these must be jupytext-paired and gitignored."
            echo "Offenders:"
            git ls-files notebooks | grep '\.ipynb$'
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Lockfile drift gate
        # C4-9 / review P2.26: pyproject <-> uv.lock drift fails CI here,
        # before anything installs.
        run: uv lock --check

      - name: Install dependencies
        # Reproducible install straight from the committed lockfile into the
        # project venv. Every gate below runs inside it via `uv run --frozen`
        # (no re-resolution, no lock mutation mid-run).
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run --frozen ruff check src/ tests/ scripts/

      - name: Format check
        run: uv run --frozen ruff format --check src/ tests/ scripts/

      - name: Type check
        # Blocking since review P2.24. The env-sensitivity that kept this
        # advisory (a transitively-installed types-PyYAML would flip the yaml
        # import-untyped ignore to "unused" under warn_unused_ignores) is gone:
        # the lockfile pins the resolution and types-PyYAML is not in it, so CI
        # installs exactly the environment mypy was verified against.
        run: uv run --frozen mypy src/gridflow/

      - name: Test
        run: uv run --frozen pytest tests/ -v --tb=short -x -m "not live and not slow"

  slow-tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Slow tests
        run: uv run --frozen pytest tests/ -v --tb=short -m "slow and not live"
